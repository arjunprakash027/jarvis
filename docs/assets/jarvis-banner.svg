<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="t d">
  <title id="t">Jarvis</title>
  <desc id="d">Jarvis: speak a task, it plans a checked graph, runs it step by step and asks you before each decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0a0d18"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="880" height="220" rx="24" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="878.5" height="218.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- the icon, same drawing as jarvis-icon.svg -->
  <g transform="translate(46 46)">
    <g stroke="#5eead4" stroke-width="7" stroke-linecap="round">
      <line x1="22" y1="54" x2="22" y2="74"/>
      <line x1="35" y1="42" x2="35" y2="86"/>
      <line x1="48" y1="56" x2="48" y2="72"/>
    </g>
    <g fill="none" stroke="url(#ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M56 64 L72 40"/>
      <path d="M56 64 L72 88"/>
      <path d="M78 40 L94 60"/>
      <path d="M78 88 L94 68"/>
    </g>
    <circle cx="75" cy="38" r="7" fill="#7dd3fc"/>
    <circle cx="75" cy="90" r="7" fill="#7dd3fc"/>
    <rect x="89" y="55" width="18" height="18" rx="3" transform="rotate(45 98 64)" fill="#a78bfa"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="200" y="104" font-size="62" font-weight="700" fill="#f4f6fb" letter-spacing="-1.5">Jarvis</text>
    <text x="202" y="142" font-size="21" fill="#aab3c8">Speak a task. It plans a graph, runs it, and asks before it decides.</text>
    <!-- one text run, so the gaps stay equal with any font -->
    <text x="202" y="178" font-size="14" font-weight="600" letter-spacing="1.2"><tspan fill="#5eead4">VOICE</tspan><tspan dx="12" fill="#56607a">→</tspan><tspan dx="12" fill="#7dd3fc">ROUTER</tspan><tspan dx="12" fill="#56607a">→</tspan><tspan dx="12" fill="#7dd3fc">TASK GRAPH</tspan><tspan dx="12" fill="#56607a">→</tspan><tspan dx="12" fill="#a78bfa">HUMAN GATE</tspan></text>
  </g>
</svg>
