[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice-driven task automation engine on macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "restate-sdk[serve]>=1.5.1",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
