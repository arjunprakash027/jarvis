<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t d">
  <title id="t">Jarvis icon</title>
  <desc id="d">A voice waveform that flows into a small task graph and ends at a diamond gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0a0d18"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  <!-- voice: three waveform bars -->
  <g stroke="#5eead4" stroke-width="7" stroke-linecap="round">
    <line x1="22" y1="54" x2="22" y2="74"/>
    <line x1="35" y1="42" x2="35" y2="86"/>
    <line x1="48" y1="56" x2="48" y2="72"/>
  </g>
  <!-- graph: the request splits into two steps and joins at the gate -->
  <g fill="none" stroke="url(#ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 64 L72 40"/>
    <path d="M56 64 L72 88"/>
    <path d="M78 40 L94 60"/>
    <path d="M78 88 L94 68"/>
  </g>
  <circle cx="75" cy="38" r="7" fill="#7dd3fc"/>
  <circle cx="75" cy="90" r="7" fill="#7dd3fc"/>
  <!-- gate: the human decides here -->
  <rect x="89" y="55" width="18" height="18" rx="3" transform="rotate(45 98 64)" fill="#a78bfa"/>
</svg>
